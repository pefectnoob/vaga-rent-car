<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — DriveEasy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<div class="container py-5">

  <!-- Login admin -->
  <div id="adminLogin" style="max-width:400px;margin:auto">
    <h3 class="text-center">🔒 Espace Admin</h3>
    <input id="aUser" class="form-control mb-2" placeholder="Login (admin)">
    <input id="aPwd" type="password" class="form-control mb-2" placeholder="Mot de passe (admin)">
    <button class="btn btn-dark w-100" onclick="checkAdmin()">Connexion</button>
  </div>

  <!-- Dashboard -->
  <div id="adminDash" class="d-none">
    <h2>Tableau de bord</h2>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabRes">Réservations</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabMsg">Messages</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabUsers">Utilisateurs</button></li>
    </ul>
    <div class="tab-content bg-white p-3 shadow-sm rounded">
      <div class="tab-pane fade show active" id="tabRes">
        <table class="table table-striped"><thead><tr><th>Client</th><th>Voiture</th><th>Dates</th><th>Lieu</th><th>Total</th></tr></thead><tbody id="tbRes"></tbody></table>
      </div>
      <div class="tab-pane fade" id="tabMsg">
        <table class="table table-striped"><thead><tr><th>Date</th><th>Nom</th><th>Email</th><th>Message</th></tr></thead><tbody id="tbMsg"></tbody></table>
      </div>
      <div class="tab-pane fade" id="tabUsers">
        <table class="table table-striped"><thead><tr><th>Nom</th><th>Email</th></tr></thead><tbody id="tbUsers"></tbody></table>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function checkAdmin() {
  if (aUser.value === 'admin' && aPwd.value === 'admin') {
    document.getElementById('adminLogin').classList.add('d-none');
    document.getElementById('adminDash').classList.remove('d-none');
    charger();
  } else alert("❌ Accès refusé");
}

function charger() {
  const res = JSON.parse(localStorage.getItem('reservations') || '[]');
  tbRes.innerHTML = res.map(r => `<tr><td>${r.nom}<br><small>${r.email}</small></td><td>${r.voiture}</td><td>${r.dateDebut} → ${r.dateFin}</td><td>${r.lieu}</td><td>${r.total}</td></tr>`).join('') || '<tr><td colspan="5">Aucune réservation</td></tr>';

  const msgs = JSON.parse(localStorage.getItem('messages') || '[]');
  tbMsg.innerHTML = msgs.map(m => `<tr><td>${m.date}</td><td>${m.nom}</td><td>${m.email}</td><td>${m.message}</td></tr>`).join('') || '<tr><td colspan="4">Aucun message</td></tr>';

  const users = JSON.parse(localStorage.getItem('users') || '[]');
  tbUsers.innerHTML = users.map(u => `<tr><td>${u.nom}</td><td>${u.email}</td></tr>`).join('') || '<tr><td colspan="2">Aucun utilisateur</td></tr>';
}
</script></body></html>
