<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation — DriveEasy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container"><a class="navbar-brand" href="index.html">🚗 DriveEasy</a></div>
  </nav>

  <div class="container py-5">
    <h2 class="mb-4">Réserver une voiture</h2>
    <form id="resForm" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Voiture</label>
        <select id="voiture" class="form-select" required></select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Nom complet</label>
        <input type="text" id="nom" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Téléphone</label>
        <input type="tel" id="tel" class="form-control" required pattern="[0-9]{8}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Date début</label>
        <input type="date" id="dateDebut" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Date fin</label>
        <input type="date" id="dateFin" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Lieu de prise en charge</label>
        <select id="lieu" class="form-select">
          <option>Tunis</option>
          <option>Béja</option>
          <option>Sousse</option>
          <option>Aéroport Tunis-Carthage</option>
        </select>
      </div>
      <div class="col-12">
        <div class="alert alert-info" id="total">Total estimé : —</div>
      </div>
      <div class="col-12">
        <button class="btn btn-warning btn-lg w-100" type="submit">Confirmer la réservation</button>
      </div>
    </form>
  </div>

  <script src="js/voitures.js"></script>
  <script src="js/reservation.js"></script>
</body>
</html>
