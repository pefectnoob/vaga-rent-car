<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue — Vaga Rent Car</title>
  <!-- On remonte d'un dossier (../) pour trouver le CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🚗 VAGA Rent Car 🚗</a>
      <a href="reservation.html" class="btn btn-warning btn-sm">Réservations</a>
    </div>
  </nav>

  <!-- CONTENU -->
  <div class="container py-5">
    <h1 class="mb-4">Catalogue des voitures</h1>

    <!-- RECHERCHE ET FILTRES -->
    <div class="row mb-4 g-2">
      <div class="col-md-4">
        <input type="text" id="search" class="form-control" placeholder="Rechercher (nom, marque)…">
      </div>
      <div class="col-md-4">
        <select id="filterCat" class="form-select">
          <option value="">Toutes catégories</option>
          <option>Citadine</option>
          <option>Compacte</option>
          <option>SUV</option>
          <option>Luxe</option>
          <option>Économique</option>
        </select>
      </div>
      <div class="col-md-4">
        <input type="number" id="maxPrice" class="form-control" placeholder="Prix max (DT/jour)">
      </div>
    </div>

    <!-- ZONE D'AFFICHAGE DES VOITURES -->
    <div class="row g-4" id="carsList"></div>
  </div>

  <!-- BOUTON RETOUR ACCUEIL -->
  <div class="container mb-5">
      <a href="index.html" class="btn btn-outline-secondary">← Retour à l'accueil</a>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // 1. DONNÉES DES VOITURES (Intégrées directement ici pour éviter les erreurs de fichiers)
    const VOITURES = [
      { id: 1, nom: "Chery Tiggo 4", marque: "Chery", categorie: "SUV", prix: 130, places: 5, carburant: "Essence", transmission: "Automatique", image: "../images/cherry.jpg", disponible: true },
      { id: 2, nom: "Marcades CLA", marque: "Hyundai", categorie: "Compacte", prix: 180, places: 5, carburant: "Essence", transmission: "Automatique", image: "../images/claamg.jpg", disponible: true },
      { id: 3, nom: "Renault Clio 4", marque: "Renault", categorie: "Citadine", prix: 65, places: 5, carburant: "Diesel", transmission: "Manuelle", image: "../images/clio4.jpg", disponible: true },
      { id: 4, nom: "Fiat 500", marque: "Fiat", categorie: "Citadine", prix: 70, places: 4, carburant: "Essence", transmission: "Manuelle", image: "../images/fiat 500.jpg", disponible: true },
      { id: 5, nom: "Hyundai i10", marque: "Hyundai", categorie: "Économique", prix: 45, places: 4, carburant: "Essence", transmission: "Manuelle", image: "../images/i10.jpg", disponible: true },
      { id: 6, nom: "Hyundai i20", marque: "Hyundai", categorie: "Citadine", prix: 75, places: 5, carburant: "Essence", transmission: "Automatique", image: "../images/i20.jpg", disponible: true },
      { id: 7, nom: "Seat Ibiza", marque: "Seat", categorie: "Citadine", prix: 85, places: 5, carburant: "Essence", transmission: "Manuelle", image: "../images/ibiza.jpg", disponible: true },
      { id: 8, nom: "Kia Rio", marque: "Kia", categorie: "Citadine", prix: 70, places: 5, carburant: "Essence", transmission: "Manuelle", image: "../images/kiario.jpg", disponible: true },
      { id: 9, nom: "Mahindra KUV100", marque: "Mahindra", categorie: "SUV", prix: 60, places: 5, carburant: "Diesel", transmission: "Manuelle", image: "../images/mahindra.jpg", disponible: true },
      { id: 10, nom: "Skoda Fabia", marque: "Skoda", categorie: "Citadine", prix: 80, places: 5, carburant: "Essence", transmission: "Automatique", image: "../images/scoda.jpg", disponible: true },
      { id: 11, nom: "Seat Leon", marque: "Seat", categorie: "Compacte", prix: 110, places: 5, carburant: "Diesel", transmission: "Automatique", image: "../images/seatleon.jpg", disponible: true },
      { id: 12, nom: "Kia Sportage", marque: "Kia", categorie: "SUV", prix: 160, places: 5, carburant: "Diesel", transmission: "Automatique", image: "../images/sportage.jpg", disponible: true }
    ];

    // 2. FONCTION D'AFFICHAGE
    function afficher(liste) {
      const c = document.getElementById('carsList');
      c.innerHTML = '';
      
      if (!liste.length) { 
        c.innerHTML = '<div class="col-12"><p class="text-muted alert alert-warning">Aucune voiture ne correspond à votre recherche.</p></div>'; 
        return; 
      }
      
      liste.forEach(v => {
        // col-12 (mobile) | col-sm-6 (tablette) | col-lg-3 (PC = 4 par ligne)
        c.innerHTML += `
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card h-100 shadow-sm">
              <img src="${v.image}" class="card-img-top" style="height:180px;object-fit:cover; background-color:#eee;" alt="${v.nom}" onerror="this.src='https://via.placeholder.com/300x180?text=Image+manquante'">
              <div class="card-body d-flex flex-column">
                <h6 class="fw-bold">${v.nom}</h6>
                <p class="small text-muted mb-1">${v.carburant} • ${v.transmission} • ${v.places} places</p>
                <p class="text-warning fw-bold mb-3">${v.prix} DT / jour</p>
                
                <!-- Le mt-auto pousse le bouton tout en bas de la carte -->
                <div class="mt-auto">
                  ${v.disponible 
                    ? `<a href="reservation.html?id=${v.id}" class="btn btn-dark btn-sm w-100">Réserver</a>`
                    : `<button class="btn btn-secondary btn-sm w-100" disabled>Indisponible</button>`}
                </div>
              </div>
            </div>
          </div>`;
      });
    }

    // 3. FONCTION DE FILTRAGE (Recherche, Catégorie, Prix)
    function filtrer() {
      const q = document.getElementById('search').value.toLowerCase();
      const cat = document.getElementById('filterCat').value;
      const max = parseFloat(document.getElementById('maxPrice').value) || Infinity;
      
      const res = VOITURES.filter(v =>
        (v.nom.toLowerCase().includes(q) || v.marque.toLowerCase().includes(q)) &&
        (!cat || v.categorie === cat) &&
        v.prix <= max
      );
      afficher(res);
    }

    // 4. ÉCOUTEURS D'ÉVÉNEMENTS
    ['search','filterCat','maxPrice'].forEach(id =>
      document.getElementById(id).addEventListener('input', filtrer)
    );
    
    // 5. LANCEMENT AU CHARGEMENT DE LA PAGE
    afficher(VOITURES);
  </script>
</body>
</html>
