<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — DriveEasy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<div class="container py-5" style="max-width:450px">
  <h2 class="text-center mb-4">Mon compte</h2>
  <ul class="nav nav-pills mb-3 justify-content-center">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">Connexion</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#register">Inscription</button></li>
  </ul>
  <div class="tab-content bg-white p-4 shadow-sm rounded">
    <div class="tab-pane fade show active" id="login">
      <input id="lEmail" class="form-control mb-2" placeholder="Email">
      <input id="lPwd" type="password" class="form-control mb-2" placeholder="Mot de passe">
      <button class="btn btn-warning w-100" onclick="login()">Se connecter</button>
    </div>
    <div class="tab-pane fade" id="register">
      <input id="rNom" class="form-control mb-2" placeholder="Nom">
      <input id="rEmail" class="form-control mb-2" placeholder="Email">
      <input id="rPwd" type="password" class="form-control mb-2" placeholder="Mot de passe">
      <button class="btn btn-dark w-100" onclick="register()">S'inscrire</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
</body></html>
