<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — VAGA Rent Car</title>
  
  <!-- On remonte d'un dossier pour le CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Icônes Bootstrap (pour le téléphone, mail, etc.) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🚗 VAGA Rent Car 🚗</a>
      <a href="voitures.html" class="btn btn-warning btn-sm">Voir les voitures</a>
    </div>
  </nav>

  <!-- CONTENU PRINCIPAL -->
  <div class="container py-5">
    
    <!-- BANDEAU INFORMATIONS DE CONTACT -->
    <div class="row justify-content-center mb-5">
      <div class="col-md-8 text-center">
        <h3 class="fw-bold mb-4">Besoin d'aide ?</h3>
        
        <div class="d-flex flex-column flex-md-row justify-content-center gap-4 bg-light p-4 rounded shadow-sm">
          
          <!-- Téléphone -->
          <div class="d-flex align-items-center justify-content-center gap-2">
            <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
              <i class="bi bi-telephone-fill fs-5"></i>
            </div>
            <div class="text-start">
              <small class="text-muted d-block">Téléphone</small>
              <a href="tel:+21627559834" class="text-dark fw-bold text-decoration-none">+216 27 559 834</a>
            </div>
          </div>

          <!-- Email -->
          <div class="d-flex align-items-center justify-content-center gap-2">
            <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
              <i class="bi bi-envelope-fill fs-5"></i>
            </div>
            <div class="text-start">
              <small class="text-muted d-block">Email</small>
              <a href="mailto:vagarentcar@gmail.com" class="text-dark fw-bold text-decoration-none">vagarentcar@gmail.com</a>
            </div>
          </div>

        </div>
      </div>
    </div>
    <!-- FIN DU BANDEAU -->

    <!-- FORMULAIRE DE CONTACT -->
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="mb-4 text-center">Contactez-nous</h2>

        <form id="contactForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Nom complet</label>
            <input type="text" id="cNom" class="form-control" placeholder="Votre nom" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="cEmail" class="form-control" placeholder="votre@email.com" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea id="cMsg" class="form-control" rows="4" placeholder="Comment pouvons-nous vous aider ?" required></textarea>
          </div>
          
          <button class="btn btn-warning w-100 fw-bold py-2" type="submit">Envoyer le message</button>
        </form>

        <!-- Message de succès caché au départ -->
        <div id="ok" class="alert alert-success mt-3 d-none">
          ✅ Votre message a bien été enregistré. Nous vous répondrons rapidement.
        </div>
      </div>
    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // GESTION DU FORMULAIRE (Enregistrement dans le localStorage)
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contactForm');
      const okMsg = document.getElementById('ok');
      if (!form) return;

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        // Récupération des champs
        const nom     = document.getElementById('cNom').value.trim();
        const email   = document.getElementById('cEmail').value.trim();
        const message = document.getElementById('cMsg').value.trim();

        // Validation simple
        if (nom.length < 3) {
          alert("Le nom doit contenir au moins 3 caractères.");
          return;
        }
        if (message.length < 10) {
          alert("Le message doit contenir au moins 10 caractères.");
          return;
        }

        // Création de l'objet
        const nouveauMessage = {
          id: Date.now(),
          nom: nom,
          email: email,
          message: message,
          date: new Date().toLocaleString('fr-FR')
        };

        // Sauvegarde localStorage
        const liste = JSON.parse(localStorage.getItem('messages') || '[]');
        liste.push(nouveauMessage);
        localStorage.setItem('messages', JSON.stringify(liste));

        // Feedback utilisateur
        okMsg.classList.remove('d-none');
        setTimeout(() => okMsg.classList.add('d-none'), 5000); // Cache le message après 5 sec

        form.reset();
      });
    });
  </script>
</body>
</html>
